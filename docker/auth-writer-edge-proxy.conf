events {}

http {
  access_log off;

  # Resolve the Compose service through Docker DNS at request time. The
  # auth-writer container may be recreated during a normal dev rebuild, so a
  # startup-only DNS resolution can otherwise leave this bridge pointing at a
  # stale container IP and returning 502.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 5090;
    server_name _;

    location / {
      set $auth_writer_upstream http://auth-writer:5090;
      proxy_pass $auth_writer_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
}
