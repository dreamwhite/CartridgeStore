name: prg32-standalone

# Standalone deployment contract.
#
# This file intentionally has no external networks, proxy labels, host-port
# publishing, Dream services, identity-provider services or SMTP fixture.
# Use compose.direct.yaml for loopback-only diagnostics or compose.proxy.yaml
# when an operator has explicitly created a reverse-proxy network.
services:
  fastify:
    build:
      context: ../../backend
      dockerfile: Dockerfile.operational
    image: ${PRG32_FASTIFY_IMAGE:-prg32-cartridge-store-fastify:standalone}
    environment:
      NODE_ENV: production
      PRG32_BACKEND_HOST: 0.0.0.0
      PRG32_BACKEND_PORT: "5080"
      PRG32_BACKEND_DB: /data/canonical/store.sqlite
      PRG32_BACKEND_STORE_DATA: /data/canonical
      PRG32_BACKEND_CATALOG_READ_MODE: canonical-operational
      PRG32_BACKEND_CANONICAL_STORAGE_ROOT: /data/canonical
      PRG32_BACKEND_CANONICAL_READ_AUTHORIZATION: ${PRG32_CANONICAL_READ_AUTHORIZATION:?set through an external secret provider}
      PRG32_BACKEND_CANONICAL_WORKFLOW_MODE: operational
      PRG32_BACKEND_CANONICAL_WRITE_AUTHORIZATION: ${PRG32_CANONICAL_WRITE_AUTHORIZATION:?set through an external secret provider}
      PRG32_BACKEND_AUTH_WRITE_ENABLED: "true"
      PRG32_BACKEND_AUTH_WRITE_MODE: operational
      PRG32_BACKEND_AUTH_WRITE_DB: /data/canonical/store.sqlite
      PRG32_BACKEND_AUTH_DISPOSABLE_ROOT: /data/canonical
      PRG32_BACKEND_SESSION_SECRET: ${PRG32_SESSION_SECRET:?set through an external secret provider}
      PRG32_BACKEND_BOOTSTRAP_TOKEN: ${PRG32_BOOTSTRAP_TOKEN:?set through an external secret provider}
      PRG32_BACKEND_SESSION_SECURE: "true"
      PRG32_BACKEND_SESSION_SAMESITE: ${PRG32_SESSION_SAMESITE:-lax}
      PRG32_BACKEND_SESSION_COOKIE_DOMAIN: ${PRG32_SESSION_COOKIE_DOMAIN:-}
      PRG32_BACKEND_TRUST_PROXY: ${PRG32_TRUST_PROXY:?set true only when an approved reverse proxy is the sole ingress}
      PRG32_BACKEND_FRONTEND_PUBLIC_ORIGIN: ${PRG32_FRONTEND_PUBLIC_ORIGIN:?set the HTTPS storefront origin}
      PRG32_BACKEND_FEDERATION_PUBLIC_ORIGIN: ${PRG32_API_PUBLIC_ORIGIN:?set the HTTPS API origin}
      PRG32_BACKEND_OIDC_PUBLIC_ORIGIN: ${PRG32_API_PUBLIC_ORIGIN:?set the HTTPS API origin}
      PRG32_BACKEND_CORS_ORIGINS: ${PRG32_FRONTEND_PUBLIC_ORIGIN:?set the HTTPS storefront origin}
      PRG32_BACKEND_EMAIL_TRANSPORT: ${PRG32_EMAIL_TRANSPORT:-disabled}
      PRG32_BACKEND_EMAIL_SMTP_HOST: ${PRG32_SMTP_HOST:-}
      PRG32_BACKEND_EMAIL_SMTP_PORT: ${PRG32_SMTP_PORT:-587}
      PRG32_BACKEND_EMAIL_SMTP_USER: ${PRG32_SMTP_USER:-}
      PRG32_BACKEND_EMAIL_SMTP_PASSWORD: ${PRG32_SMTP_PASSWORD:-}
      PRG32_BACKEND_EMAIL_FROM: ${PRG32_EMAIL_FROM:-no-reply@example.invalid}
      PRG32_BACKEND_EMAIL_PUBLIC_ORIGIN: ${PRG32_FRONTEND_PUBLIC_ORIGIN:?set the HTTPS storefront origin}
      PRG32_BACKEND_SETUP_NETWORK_TEST_ALLOWLIST: ${PRG32_SETUP_NETWORK_TEST_ALLOWLIST:-}
      PRG32_BACKEND_BACKUP_ENABLED: "false"
      PRG32_BACKEND_SECRET_ENCRYPTION_ENABLED: "true"
      PRG32_BACKEND_SECRET_KEY_REGISTRY: /run/secrets/prg32-secret-key-registry
      PRG32_BACKEND_MDNS_ENABLED: "false"
      PRG32_BACKEND_WEBAUTHN_ENABLED: ${PRG32_WEBAUTHN_ENABLED:-false}
      PRG32_BACKEND_WEBAUTHN_RP_ID: ${PRG32_WEBAUTHN_RP_ID:-}
      PRG32_BACKEND_WEBAUTHN_ORIGINS: ${PRG32_WEBAUTHN_ORIGINS:-}
    volumes:
      - type: bind
        source: ${PRG32_DATA_DIR:?set an operator-controlled canonical data directory}
        target: /data/canonical
    networks:
      - app_private
    expose:
      - "5080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: prg32_secret_key_registry
        target: prg32-secret-key-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5080/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  next:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.operational
    image: ${PRG32_NEXT_IMAGE:-prg32-cartridge-store-next:standalone}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      PRG32_API_UPSTREAM: http://fastify:5080
      PRG32_NEXT_RUNTIME_MODE: operational
      NEXT_PUBLIC_PRG32_WS_URL: ${PRG32_WS_PUBLIC_URL:?set the public WebSocket URL}
    depends_on:
      fastify:
        condition: service_healthy
    networks:
      - app_private
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

networks:
  app_private:
    driver: bridge
    internal: true

secrets:
  prg32_secret_key_registry:
    file: ${PRG32_KEY_REGISTRY_FILE:?provide an external 0600 key registry file}
